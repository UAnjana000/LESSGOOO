[project]
name = "ambedkar-archive"
version = "0.1.0"
description = "Dr. B. R. Ambedkar Digital Heritage Archive - edge server API, workers and workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-text-splitters>=0.3",
    "langfuse>=3.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "imagehash>=4.3",
    "rapidfuzz>=3.9",
    "lingua-language-detector>=2.0",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "cryptography>=43",
    "qrcode>=7.4",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
models = [
    "fastembed>=0.5",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: requires a PostgreSQL+pgvector database (ARCHIVE_TEST_DATABASE_URL)",
    "tesseract: requires the tesseract binary with eng/hin/mar data",
    "models: requires downloaded local embedding/reranker models",
]

[tool.ruff]
line-length = 110
target-version = "py312"
