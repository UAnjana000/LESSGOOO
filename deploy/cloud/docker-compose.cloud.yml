# Cloud VM overlay for the root docker-compose.yml (see deploy/cloud/README.md):
#   docker compose -f docker-compose.yml -f deploy/cloud/docker-compose.cloud.yml up -d
# Paths resolve from the repository root, the directory of the first compose file.
services:
  proxy:
    volumes:
      - ./deploy/cloud/Caddyfile:/etc/caddy/Caddyfile:ro
